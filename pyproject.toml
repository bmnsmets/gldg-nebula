[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[project]
name = "gldg-nebula"
version = "0.1.0"
description = "Python tools for working with Nebula"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
    { name = "B.M.N. Smets", email = "b.m.n.smets@tue.nl" },
    { name = "L. Vis", email = "l.vis@tue.nl" },
]
requires-python = ">=3.14"
dependencies = [
    "cstool",
    "numpy>=2.5",
    "scipy>=1.18.1",
    "matplotlib>=3.11.2",
    "safetensors>=0.8",
    "h5py>=3.16",
    "tqdm>=4.70.1",
]

[project.scripts]
nebula = "nebula.cli:main"

[dependency-groups]
dev = ["pytest"]

[tool.uv.build-backend]
module-name = "nebula"
module-root = "python"

[tool.uv.sources]
cstool = { path = "third_party/cstool", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests/python"]
markers = [
    "requires_nebula: needs the built Nebula binaries on PATH",
    "gpu: needs nebula_gpu and a CUDA device",
]
